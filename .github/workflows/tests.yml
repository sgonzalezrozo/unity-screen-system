name: Tests

# Runs the Edit Mode tests on every push and pull request. It needs a Unity license in the repository
# secrets (UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD); without them the run is skipped with a notice.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editmode:
    name: Edit Mode tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check for a Unity license
        id: license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::notice::No UNITY_LICENSE secret, so the tests were skipped. Add UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD to the repository secrets."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.license.outputs.available == 'true'

      - name: Cache the Library folder
        if: steps.license.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: .github/ci-project/Library
          key: library-${{ hashFiles('.github/ci-project/Packages/manifest.json', '.github/ci-project/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: library-

      - name: Run tests
        if: steps.license.outputs.available == 'true'
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .github/ci-project
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Edit Mode test results

      - name: Upload test results
        if: always() && steps.license.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts
